<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoCartFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="80%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="logoBasket" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#0084FF" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="logoSpeed1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="logoSpeed2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="logoSpeed3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="logoLeftWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="logoRightWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Speed Lines -->
  <line x1="8" y1="52" x2="40" y2="52" stroke="url(#logoSpeed1)" stroke-width="7" stroke-linecap="round" />
  <line x1="18" y1="72" x2="52" y2="72" stroke="url(#logoSpeed2)" stroke-width="7" stroke-linecap="round" />
  <line x1="28" y1="92" x2="58" y2="92" stroke="url(#logoSpeed3)" stroke-width="7" stroke-linecap="round" />

  <!-- Cart Frame -->
  <path d="M 22 36 L 48 36 C 54 36 58 40 60 46 L 74 90 C 76 96 82 100 88 100 L 142 100" fill="none" stroke="url(#logoCartFrame)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stylized Basket (E/T Monogram) -->
  <path d="M 72 48 L 148 48 C 153 48 156 51 156 56 C 156 61 153 64 148 64 L 120 64 L 104 92 C 102 96 98 98 94 98 L 88 98 C 84 98 81 94 83 90 L 95 64 L 72 64 C 67 64 64 61 64 56 C 64 51 67 48 72 48 Z" fill="url(#logoBasket)" />

  <!-- Wheels -->
  <circle cx="74" cy="124" r="12" fill="url(#logoLeftWheel)" />
  <circle cx="132" cy="124" r="12" fill="url(#logoRightWheel)" />

  <!-- Wordmark "Empire" -->
  <g fill="#F1F5F9" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-size="78" font-weight="800" letter-spacing="-1">
    <text x="174" y="98">Emp<tspan fill="#F1F5F9">ı</tspan>re</text>
  </g>
  <!-- Electric Blue Dot on the 'i' -->
  <rect x="361" y="38" width="13" height="13" rx="3" fill="#0091FF" />

  <!-- Tagline -->
  <g font-family="'Inter', 'Poppins', sans-serif" font-size="13" font-weight="700" letter-spacing="4.5">
    <text x="178" y="132" fill="#38BDF8">SHOP</text>
    <circle cx="236" cy="128" r="2.5" fill="#38BDF8" />
    <text x="254" y="132" fill="#A855F7">SELL</text>
    <circle cx="308" cy="128" r="2.5" fill="#A855F7" />
    <text x="326" y="132" fill="#38BDF8">GET IT FAST</text>
  </g>
</svg>
