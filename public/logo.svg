<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Electric Blue Gradient for Cart Frame -->
    <linearGradient id="logoCartFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="35%" stop-color="#0080FF" />
      <stop offset="70%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#0040E0" />
    </linearGradient>

    <!-- Electric Blue Gradient for Infill Basket -->
    <linearGradient id="logoBasket" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="45%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0044DD" />
    </linearGradient>

    <!-- Speed Streaks Gradients -->
    <linearGradient id="logoSpeed1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="logoSpeed2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="logoSpeed3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>

    <!-- Wheel Gradients -->
    <linearGradient id="logoWheel1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0044DD" />
    </linearGradient>
    <linearGradient id="logoWheel2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0044DD" />
    </linearGradient>

    <!-- Blue Dot Gradient on the 'i' -->
    <linearGradient id="logoDotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>

  <!-- Speed Lines -->
  <line x1="6" y1="40" x2="38" y2="40" stroke="url(#logoSpeed1)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="16" y1="58" x2="48" y2="58" stroke="url(#logoSpeed2)" stroke-width="5.5" stroke-linecap="round" />
  <line x1="28" y1="76" x2="52" y2="76" stroke="url(#logoSpeed3)" stroke-width="5.5" stroke-linecap="round" />

  <!-- Outer Handle & Base Strut Frame -->
  <path d="M 22 28 L 44 28 C 49 28 53 31 55 36 L 68 72 C 70 77 75 80 81 80 L 128 80" fill="none" stroke="url(#logoCartFrame)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stylized Infill Basket / T-Shape -->
  <path d="M 68 39 L 130 39 C 134 39 137 42 137 46 C 137 50 134 53 130 53 L 107 53 L 96 76 C 94 79 91 81 88 81 L 83 81 C 79 81 76 78 78 74 L 88 53 L 68 53 C 64 53 61 50 61 46 C 61 42 64 39 68 39 Z" fill="url(#logoBasket)" />

  <!-- Left and Right Wheels -->
  <circle cx="68" cy="100" r="10.5" fill="url(#logoWheel1)" />
  <circle cx="118" cy="100" r="10.5" fill="url(#logoWheel2)" />

  <!-- Wordmark "Empire" -->
  <g fill="#FFFFFF" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-0.8">
    <text x="150" y="78">Emp</text>
    <!-- Dotless 'ı' stem only -->
    <text x="295" y="78">ı</text>
    <text x="313" y="78">re</text>
  </g>

  <!-- The ONLY Dot on the 'i' -> Electric Blue Rounded Rectangle -->
  <rect x="295.5" y="27" width="14" height="13" rx="3" fill="url(#logoDotGrad)" />

  <!-- Tagline "SHOP • SELL • GET IT FAST" -->
  <g font-family="'Inter', 'Poppins', sans-serif" font-size="12.5" font-weight="800" letter-spacing="3.5" fill="#FFFFFF">
    <text x="152" y="108">SHOP</text>
    <circle cx="210" cy="104" r="2.8" fill="#0080FF" />
    <text x="226" y="108">SELL</text>
    <circle cx="280" cy="104" r="2.8" fill="#0080FF" />
    <text x="296" y="108">GET IT FAST</text>
  </g>
</svg>
